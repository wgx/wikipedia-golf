name: Build

on:
  push:
    branches: [main]
    paths: ['src/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Minify src/index.html to root
        run: |
          npx --yes html-minifier-terser@7 src/index.html \
            --collapse-whitespace --remove-comments \
            --minify-css true --minify-js true \
            -o index.html
          cp src/wikipedia-golf.png wikipedia-golf.png

      - name: Commit built files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html wikipedia-golf.png
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Build: minify src/index.html"
            git push
          fi
